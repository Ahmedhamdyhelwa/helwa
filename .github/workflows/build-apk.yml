name: بناء التطبيق (APK)

on:
  push:
    branches:
      - claude/youthful-volta-ezufld
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Android SDK
        uses: android-actions/setup-android@v3

      - name: صلاحية تنفيذ gradlew
        run: chmod +x ./gradlew

      - name: بناء ملف APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: رفع الـ APK كملف للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: نشر نسخة جاهزة للتحميل (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "نسخة التطبيق رقم ${{ github.run_number }}"
          body: |
            ملف تثبيت تطبيق "حياتي" 📱

            للتثبيت على الموبايل:
            1. نزّل ملف **app-debug.apk** من تحت.
            2. افتحه من الموبايل واسمح بالتثبيت من مصادر غير معروفة.
            3. ثبّت التطبيق واستمتع 🎉
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
